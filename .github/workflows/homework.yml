name: Homework
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  learner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check classroom snapshots
        run: sha256sum --check class/SHA256SUMS
      - name: Verify public dataset and starter
        run: python -m unittest discover -s tests -v
      - name: Replay the four classroom notebooks without changing their saved cells
        run: |
          python -m pip install 'nbclient==0.10.2' 'nbformat==5.10.4' 'ipykernel==6.30.1'
          python - <<'PY'
          import os
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          files = sorted(Path('class').rglob('*.ipynb'))
          assert len(files) == 4
          for path in files:
              notebook = NotebookClient(nbformat.read(path, as_version=4), timeout=60).execute(cwd=str(path.parent.resolve()))
              if path.name == 'spike_school.ipynb':
                  html = notebook.cells[-1].outputs[0].data['text/html']
                  (Path(os.environ['RUNNER_TEMP']) / 'spike-arcade.html').write_text(html, encoding='utf-8')
              print('Executed', path)
          PY
      - name: Exercise the arcade at desktop and phone widths
        run: |
          python -m pip install 'playwright==1.58.0'
          python .github/check_arcade.py "$RUNNER_TEMP/spike-arcade.html" "$RUNNER_TEMP/arcade-screenshots"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: classroom-arcade
          path: ${{ runner.temp }}/arcade-screenshots
          if-no-files-found: error
          retention-days: 7
